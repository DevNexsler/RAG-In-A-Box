# Staging config — bind-mounted over /app/config.yaml by docker-compose.staging.yml.
# Every provider points at the provider-sim container; the "keys" are fakes
# (the sim ignores auth), so this file is safe to commit.
#
# Sources-mode (NOT documents_root): the two cannot coexist (core/config.py).
# The postgres source MUST be named "sor" — sor_query.resolve_sor_dsn() looks
# it up by that exact name.

index_root: /data/index

sources:
  - type: filesystem
    name: documents
    root: /data/documents
    scan:
      include:
        - "**/*.md"
        - "**/*.txt"
        - "**/*.pdf"
        - "**/*.png"
        - "**/*.jpg"
        - "**/*.jpeg"
        - "**/*.wav"
        - "**/*.mp3"
        - "**/*.mp4"
      exclude:
        - "**/.DS_Store"

  - type: postgres
    name: sor
    dsn: "${COMM_DATA_STORE_DSN}"
    tables:
      - source_type: pg_message
        query: |
          SELECT source, source_message_id, channel_name,
                 channel_name AS source_channel_id, sender, direction,
                 sent_at, updated_at,
                 CASE
                   WHEN NULLIF(BTRIM(COALESCE(subject, '')), '') IS NULL
                     THEN body
                   WHEN NULLIF(BTRIM(COALESCE(body, '')), '') IS NULL
                     THEN 'Subject: ' || BTRIM(subject)
                   ELSE 'Subject: ' || BTRIM(subject)
                     || E'\n\nBody:\n' || body
                 END AS _text,
                 subject
          FROM messages
          WHERE NULLIF(BTRIM(COALESCE(subject, '')), '') IS NOT NULL
             OR NULLIF(BTRIM(COALESCE(body, '')), '') IS NOT NULL
        id_template: "{source}/{source_message_id}"
        text_column: _text
        text_normalizer: zoho_cliq_mentions
        mtime_column: updated_at
        metadata_columns: [source, source_message_id, source_channel_id, channel_name, sender, subject, sent_at, direction]

      - source_type: sor_unit
        query: |
          SELECT bu.id, COALESCE(bu.updated_at, bu.created_at) AS _mtime,
                 unit_title.title
                 || COALESCE(E'\nBed: ' || bu."Bed"::text, '') || COALESCE(' Bath: ' || bu."Bath"::text, '')
                 || COALESCE(E'\n\n' || bu."Description", '')
                 || E'\nStatus: ' || COALESCE(bu."Status", '') AS _text,
                 unit_title.title, bu."Unit" AS unit, bu."Status" AS status,
                 b."Nick_Name" AS building
          FROM "Building Units" bu
          LEFT JOIN "Buildings" b ON b.id = bu."Buildings_id"
          CROSS JOIN LATERAL (
            SELECT regexp_replace(btrim(COALESCE(b."Nick_Name", '')), '[[:space:]]+', ' ', 'g') AS building,
                   regexp_replace(btrim(COALESCE(bu."Unit", '')), '[[:space:]]+', ' ', 'g') AS unit
          ) normalized
          CROSS JOIN LATERAL (
            SELECT btrim(CASE
              WHEN normalized.building = '' AND normalized.unit = '' THEN 'Unit'
              WHEN normalized.building = '' THEN
                CASE WHEN normalized.unit ~* '^unit($|[[:space:]])'
                     THEN normalized.unit ELSE 'Unit ' || normalized.unit END
              WHEN normalized.unit = '' THEN normalized.building
              WHEN normalized.building ~* '(^|[[:space:]])unit$' THEN
                normalized.building || ' ' || regexp_replace(
                  normalized.unit, '^unit[[:space:]]*', '', 'i'
                )
              WHEN normalized.unit ~* '^unit($|[[:space:]])' THEN
                normalized.building || ' ' || normalized.unit
              ELSE normalized.building || ' Unit ' || normalized.unit
            END) AS title
          ) unit_title
        id_template: "unit/{id}"
        text_column: _text
        mtime_column: _mtime
        metadata_columns: [title, unit, status, building]

pdf:
  strategy: "text_then_ocr"
  ocr_page_limit: 20
  min_text_chars_before_ocr: 200

ocr:
  enabled: true
  provider: "deepseek_ocr2"
  base_url: "http://provider-sim:9999"
  timeout: 60
  concurrency: 1   # below prod's 2 — deliberate memory-cap concession (4g mem_limit)

media:
  enabled: true
  provider: "openrouter"
  base_url: "http://provider-sim:9999/api/v1"
  audio_model: "openai/whisper-1"
  video_model: "qwen/qwen3.5-397b-a17b"
  max_file_size_mb: 50
  timeout: 60

embeddings:
  provider: "openrouter"
  model: "qwen/qwen3-embedding-8b"
  base_url: "http://provider-sim:9999/api/v1"
  batch_size: 8    # below prod's 64 — deliberate memory-cap concession (4g mem_limit)
  concurrency: 2   # matches prod; keeps the concurrent-batching path exercised
  # No max_input_tokens override: the model's real 40960-token window is
  # resolved from providers/embed/limits.py. Narrowing it here kept every
  # token-bounded input under provider-sim's 131072-character route cap by
  # accident, which put that cap out of reach of the hermetic tier (#1658).

chunking:
  max_chars: 1800
  overlap: 200
  min_chars: 150
  max_chunks_per_document: 64

enrichment:
  enabled: true
  # Match production's LiteLLM enrichment path while keeping all traffic in
  # provider-sim. This makes retry/fallback behavior part of hermetic E2E.
  provider: "litellm"
  model: "ollama-deepseek-v4-pro"
  base_url: "http://provider-sim:9999/api/v1"
  api_key: "sim"
  max_input_chars: 20000
  max_output_tokens: 2000
  # Matches prod: this is the document worker pool, so anything below it hides
  # every concurrent-dispatch race the pipeline can hit in production (#1188).
  concurrency: 4

search:
  mode: "hybrid"
  vector_top_k: 50
  keyword_top_k: 50
  final_top_k: 10
  rrf_k: 60
  # Production's ANN-index block verbatim so e2e exercises the same index type
  # and serving knobs the deployed config does.
  vector_index:
    type: "IVF_FLAT"
  nprobes: 40
  max_concurrent_vector_searches: 3
  reranker:
    enabled: true
    provider: "deepinfra"
    model: "Qwen/Qwen3-Reranker-8B"
    timeout: 30
    base_url: "http://provider-sim:9999"

# Production's block verbatim: without it the whole exact-content dedupe branch
# in process_doc_task — duplicate detection, the indexing skip, the alias
# context write, the canonical's duplicate provenance — is dead code in this
# tier, while it runs on a large share of production documents (#1188).
dedupe:
  enabled: true
  mode: "exact"
  hash_algo: "blake3"
  archive_root: "/data/index/duplicates"
  archive_duplicates: true
  update_canonical_metadata: true
  skip_duplicate_indexing: true

lancedb:
  table: "chunks"

logging:
  level: "INFO"

event_hooks:
  enabled: true
  hooks:
    - name: "staging-sink"
      type: "http"
      url: "http://provider-sim:9999/hooks/sink"
      events: ["document.indexed"]
      timeout_seconds: 5
    # Optional cross-repo callback (Comm-Data-Store). url is env-driven and
    # default-absent: unset CDS_HOOK_URL → silently skipped (the gate is
    # unaffected). CDS sets it (+ extra_hosts in docker-compose.staging.cds.yml)
    # to receive the real document.indexed event at their throwaway test hook.
    - name: "cds-callback"
      type: "http"
      url: "${CDS_HOOK_URL}"
      events: ["document.indexed"]
      accepted_statuses: ["updated", "duplicate"]
      timeout_seconds: 5

tracing:
  enabled: true
  directory: /data/traces

mcp:
  host: "0.0.0.0"
  port: 7788
