# Production runtime envelope for the doc-organizer image: the pid ceiling and
# the native thread-pool and allocator caps the server and its index runs need.
# One definition, extended by the production service (docker-compose.yml) and
# the staging-e2e candidate (docker-compose.staging.yml), so the gate runs the
# image under the same pid, thread and allocator shape as production (#4085).
# Not a stack on its own; memory sizing stays with each extending service.
services:
  doc-organizer-runtime-envelope:
    pids_limit: ${DOC_ORGANIZER_PIDS_LIMIT:-512}
    environment:
      # Lance sizes its IO and CPU pools to the host's 32 cores (the container has
      # no cpu limit): 64 threads, each with allocator arenas that retain a share
      # of every query's partition reads. 8/8 caps the fan-out for one 88k-row
      # table; the index run's throughput is bound by provider calls, not this.
      - LANCE_IO_THREADS=${LANCE_IO_THREADS:-8}
      - LANCE_CPU_THREADS=${LANCE_CPU_THREADS:-8}
      # Every other native pool sizes itself to those 32 cores too, once per
      # process: rayon (Lance index build/merge), the tokio runtimes behind
      # lance and lancedb, and OpenBLAS/Arrow (numpy, pyarrow). The index-run
      # subprocess peaked at 178 threads and the server at 167; they share
      # pids_limit with Prefect, so rayon's lazy 32-thread spawn inside
      # optimize_indices hit EAGAIN and panicked the run (#4083). Capped, the
      # same Lance work peaks near 64 threads per process.
      - RAYON_NUM_THREADS=${RAYON_NUM_THREADS:-8}
      - TOKIO_WORKER_THREADS=${TOKIO_WORKER_THREADS:-8}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-8}
      # glibc malloc (Python's allocator; Lance uses its own jemalloc) gives every
      # worker thread a private arena and keeps that thread's freed search
      # objects — ~100 candidate rows with text, metadata and a 4096-float list
      # per query — instead of returning them. Each new MCP session lands its
      # call on a fresh thread, so the server grew ~0.4 GB/h under organic load
      # and needed a restart every ~14 h (2026-09-07). Measured, 80 searches on
      # fresh threads: 457 -> 1084 MB by default, 449 -> 484 MB with these two.
      - MALLOC_ARENA_MAX=${MALLOC_ARENA_MAX:-2}
      - MALLOC_TRIM_THRESHOLD_=${MALLOC_TRIM_THRESHOLD_:-131072}
