services:
  doc-organizer:
    build: .
    image: doc-organizer:latest
    container_name: doc-organizer
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # #0325 production-shaped profiling sized this envelope at 8g for the
    # server, persistent Prefect process, and an 8-worker full-source index
    # run. 10g since 2026-09-07: with the ANN index the server's resident set
    # is a bounded ~3.5 GB plateau (Lance allocator retention across queries)
    # that shares the cgroup with the ~3.7 GB sweep subprocess; 8g left no
    # headroom (the cgroup hit its ceiling 9,000+ times in one hour). Keep
    # regression failures inside this container instead of exposing the host to
    # earlyoom; deliberate host-specific sizing remains an explicit override.
    mem_limit: ${DOC_ORGANIZER_MEMORY_LIMIT:-10g}
    mem_reservation: ${DOC_ORGANIZER_MEMORY_RESERVATION:-4g}
    pids_limit: ${DOC_ORGANIZER_PIDS_LIMIT:-512}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "7788:7788"
    volumes:
      - /home/danpark/documents/doc-organizer:/data/documents
      - doc-organizer-data:/data/index
      - ./config.yaml:/app/config.yaml:ro
      - ./.evals:/app/.evals
    command: ["python", "server.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-net
      - sor-net
      - comm-net
      - mcp-backplane
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - API_KEY=${API_KEY}
      - COMM_DATA_STORE_DSN=${COMM_DATA_STORE_DSN}
      - COMM_DATA_STORE_HOOK_SECRET=${COMM_DATA_STORE_HOOK_SECRET}
      - SOR_DSN=${SOR_DSN}
      - FACTBOOK_RPC_URL=${FACTBOOK_RPC_URL:-http://factbook-rpc:8695}
      - FACTBOOK_RPC_TOKEN=${FACTBOOK_RPC_TOKEN}
      - DOCUMENTS_ROOT=/data/documents
      - INDEX_ROOT=/data/index
      - INDEXER_DEBUG_CONCURRENCY=${INDEXER_DEBUG_CONCURRENCY:-}
      # Prune Lance versions older than this each indexing run (#0112); keeps
      # the index from re-accumulating dead versions. Default 30m if unset.
      - LANCE_VERSION_RETENTION_MINUTES=${LANCE_VERSION_RETENTION_MINUTES:-30}
      # Keep exactly this many daily version tags as logical restore points
      # (#0113); each is an in-place rollback target protected from the prune.
      # With daily compaction every retained tag pins one full rewrite of the
      # table on disk, so the window stays small (#0232). 0 = off (and removes
      # previously created daily tags).
      - LANCE_DAILY_RESTORE_POINTS=${LANCE_DAILY_RESTORE_POINTS:-7}
      # /health returns 503 when the index filesystem is at/above this
      # used-percent (#0232), so docker-health surfaces disk pressure
      # before ENOSPC takes the host down.
      - DISK_USAGE_MAX_PERCENT=${DISK_USAGE_MAX_PERCENT:-90}
      # /health returns 503 (stale_tail) when a source index request has stayed
      # queued longer than this (#1625). Thousands of successful writes say
      # nothing about the tail: a long historical drain produces them while
      # today's attachments wait, and this is the number that shows it.
      - INDEX_PENDING_MAX_AGE_S=${INDEX_PENDING_MAX_AGE_S:-1800}
      # Disable Prefect's ephemeral-server auto-start (#0325). server.py runs
      # one persistent PrefectServer and exports PREFECT_API_URL, which index
      # subprocesses inherit; with ephemeral off, a missing PREFECT_API_URL
      # fails the run loudly instead of silently starting a throwaway temporary
      # server that orphans when earlyoom kills the indexer (49+ orphans /
      # ~19 GiB baseline). One intentional server, never a leak.
      - PREFECT_SERVER_ALLOW_EPHEMERAL_MODE=false
      # Lance sizes its IO and CPU pools to the host's 32 cores (the container has
      # no cpu limit): 64 threads, each with allocator arenas that retain a share
      # of every query's partition reads. 8/8 caps the fan-out for one 88k-row
      # table; the index run's throughput is bound by provider calls, not this.
      - LANCE_IO_THREADS=${LANCE_IO_THREADS:-8}
      - LANCE_CPU_THREADS=${LANCE_CPU_THREADS:-8}

networks:
  rag-net:
    external: true
    name: rag-in-a-box_default
  sor-net:
    external: true
    name: sor-network
  comm-net:
    external: true
    name: comm-data-store_default
  mcp-backplane:
    external: true

volumes:
  doc-organizer-data:
