# Staging config — REAL-MEDIA variant (CDS final e2e run).
#
# Identical to config.staging.yaml EXCEPT: media + enrichment intentionally use
# the OpenRouter provider/model and call the real OpenRouter API instead of
# provider-sim. Everything else (embeddings, OCR, reranker) stays on the sim —
# deterministic and free — because it is not the media-enrichment path under
# test.
#
# Use for the FINAL end-to-end pass after the deterministic (all-sim) run is
# green. Requires a real OPENROUTER_API_KEY in the container env (the CDS
# override passes it through). This run SPENDS REAL MONEY.
#
# KEEP IN SYNC with config.staging.yaml. Intended differences: media and
# enrichment provider/model/base URL/API-key source; media timeout; audio
# fallback chain. If you change the base config's sources/chunking/search,
# mirror it here.

index_root: /data/index

sources:
  - type: filesystem
    name: documents
    root: /data/documents
    scan:
      include:
        - "**/*.md"
        - "**/*.txt"
        - "**/*.pdf"
        - "**/*.png"
        - "**/*.jpg"
        - "**/*.jpeg"
        - "**/*.wav"
        - "**/*.mp3"
        - "**/*.mp4"
      exclude:
        - "**/.DS_Store"

  - type: postgres
    name: sor
    dsn: "${COMM_DATA_STORE_DSN}"
    tables:
      - source_type: pg_message
        query: |
          SELECT source, source_message_id, channel_name,
                 channel_name AS source_channel_id, sender, direction,
                 sent_at, updated_at,
                 CASE
                   WHEN NULLIF(BTRIM(COALESCE(subject, '')), '') IS NULL
                     THEN body
                   WHEN NULLIF(BTRIM(COALESCE(body, '')), '') IS NULL
                     THEN 'Subject: ' || BTRIM(subject)
                   ELSE 'Subject: ' || BTRIM(subject)
                     || E'\n\nBody:\n' || body
                 END AS _text,
                 subject
          FROM messages
          WHERE NULLIF(BTRIM(COALESCE(subject, '')), '') IS NOT NULL
             OR NULLIF(BTRIM(COALESCE(body, '')), '') IS NOT NULL
        id_template: "{source}/{source_message_id}"
        text_column: _text
        text_normalizer: zoho_cliq_mentions
        mtime_column: updated_at
        metadata_columns: [source, source_message_id, source_channel_id, channel_name, sender, subject, sent_at, direction]

      - source_type: sor_unit
        query: |
          SELECT bu.id, COALESCE(bu.updated_at, bu.created_at) AS _mtime,
                 unit_title.title
                 || COALESCE(E'\nBed: ' || bu."Bed"::text, '') || COALESCE(' Bath: ' || bu."Bath"::text, '')
                 || COALESCE(E'\n\n' || bu."Description", '')
                 || E'\nStatus: ' || COALESCE(bu."Status", '') AS _text,
                 unit_title.title, bu."Unit" AS unit, bu."Status" AS status,
                 b."Nick_Name" AS building
          FROM "Building Units" bu
          LEFT JOIN "Buildings" b ON b.id = bu."Buildings_id"
          CROSS JOIN LATERAL (
            SELECT regexp_replace(btrim(COALESCE(b."Nick_Name", '')), '[[:space:]]+', ' ', 'g') AS building,
                   regexp_replace(btrim(COALESCE(bu."Unit", '')), '[[:space:]]+', ' ', 'g') AS unit
          ) normalized
          CROSS JOIN LATERAL (
            SELECT btrim(CASE
              WHEN normalized.building = '' AND normalized.unit = '' THEN 'Unit'
              WHEN normalized.building = '' THEN
                CASE WHEN normalized.unit ~* '^unit($|[[:space:]])'
                     THEN normalized.unit ELSE 'Unit ' || normalized.unit END
              WHEN normalized.unit = '' THEN normalized.building
              WHEN normalized.building ~* '(^|[[:space:]])unit$' THEN
                normalized.building || ' ' || regexp_replace(
                  normalized.unit, '^unit[[:space:]]*', '', 'i'
                )
              WHEN normalized.unit ~* '^unit($|[[:space:]])' THEN
                normalized.building || ' ' || normalized.unit
              ELSE normalized.building || ' Unit ' || normalized.unit
            END) AS title
          ) unit_title
        id_template: "unit/{id}"
        text_column: _text
        mtime_column: _mtime
        metadata_columns: [title, unit, status, building]

pdf:
  strategy: "text_then_ocr"
  ocr_page_limit: 20
  min_text_chars_before_ocr: 200

ocr:
  enabled: true
  provider: "deepseek_ocr2"
  base_url: "http://provider-sim:9999"   # sim (OCR not under test in the media path)
  timeout: 60
  concurrency: 1

media:
  enabled: true
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"   # REAL — live transcription
  audio_model: "openai/whisper-1"
  fallback_audio_models:                     # whisper-1 500s in practice; fall back
    - "mistralai/voxtral-small-24b-2507"
    - "google/gemini-2.5-flash-lite"
  video_model: "qwen/qwen3.5-397b-a17b"
  max_file_size_mb: 50
  timeout: 300   # real transcription latency (matches prod, not the sim's 60)

embeddings:
  provider: "openrouter"
  model: "qwen/qwen3-embedding-8b"
  base_url: "http://provider-sim:9999/api/v1"   # sim — deterministic vectors
  batch_size: 8
  concurrency: 2

chunking:
  max_chars: 1800
  overlap: 200
  min_chars: 150

enrichment:
  enabled: true
  provider: "openrouter"
  model: "openai/gpt-4.1-mini"
  base_url: "https://openrouter.ai/api/v1"   # REAL — live LLM enrichment
  max_input_chars: 20000
  max_output_tokens: 2000
  concurrency: 1

search:
  mode: "hybrid"
  vector_top_k: 50
  keyword_top_k: 50
  final_top_k: 10
  rrf_k: 60
  reranker:
    enabled: true
    provider: "deepinfra"
    model: "Qwen/Qwen3-Reranker-8B"
    timeout: 30
    base_url: "http://provider-sim:9999"   # sim (reranker not under test in the media path)

lancedb:
  table: "chunks"

logging:
  level: "INFO"

event_hooks:
  enabled: true
  hooks:
    - name: "staging-sink"
      type: "http"
      url: "http://provider-sim:9999/hooks/sink"
      events: ["document.indexed"]
      timeout_seconds: 5
    # Optional cross-repo callback (Comm-Data-Store) — env-driven, default-absent.
    # Unset CDS_HOOK_URL → silently skipped. This is the real prod integration CDS
    # tests: a real document.indexed event delivered to their throwaway hook.
    - name: "cds-callback"
      type: "http"
      url: "${CDS_HOOK_URL}"
      events: ["document.indexed"]
      accepted_statuses: ["updated", "duplicate"]
      timeout_seconds: 5

tracing:
  enabled: true
  directory: /data/traces

mcp:
  host: "0.0.0.0"
  port: 7788
